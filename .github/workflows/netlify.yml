name: Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 3cbc9c2b-7cf3-412e-a9ef-e61b1cf647d2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        run: npx --yes netlify-cli@26.1.0 deploy --prod --dir=dist --functions=netlify/functions --site="$NETLIFY_SITE_ID" --message="Deploy ${GITHUB_SHA}"

      - name: Explain skipped deploy
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' }}
        run: echo "Set the NETLIFY_AUTH_TOKEN repository secret to enable Netlify deployment."
